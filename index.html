<style>
:root{

  --obl:#5BA6C6;--facw:#62BDB9;--fac:#A7C487;--facu:#DDB36A;--upl:#D2905F;--focus:#7FC4E0;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141B19;--surface:#1D2623;--ink:#E4EBE6;--muted:#9DADA6;--line:#34423D;--soft:#26312D;
  --gley:#7FA7B3;--gley-ink:#0F1715;--yes:#6CC29A;--no:#E58A5E;--na:#7C8984;
  --obl:#5BA6C6;--facw:#62BDB9;--fac:#A7C487;--facu:#DDB36A;--upl:#D2905F;--focus:#7FC4E0;
  color-scheme:dark;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.bar h1{font-size:1.05rem;margin:0;font-weight:700;flex:1 1 auto;min-width:10rem}
.bar select{max-width:15rem}
.status{display:grid;grid-template-columns:repeat(4,1fr);max-width:1100px;margin:0 auto;border-top:1px solid var(--line)}

.factor:last-child{border-right:0}

.factor b{font-size:1rem}

<body>
<header>
  <div class="bar">
    <h1>Wetland determination data form</h1>
    <label class="sr" for="pointSel" style="position:absolute;left:-9999px">Sampling point</label>
    <select id="pointSel"></select>
    <button class="btn primary" id="newPt">New point</button>
    <button class="btn" id="devBtn" aria-pressed="false">Offline &amp; backup</button>
  </div>
  <div class="risk" id="risk" role="alert" hidden></div>
  <div class="status" id="status"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sugg" id="sugg" role="listbox" aria-label="Matching species" hidden></div>

<script>
/* ---------- Species list: species.json, built from the official NWPL by tools/build_species.py ---------- */
const STATUSES=["OBL","FACW","FAC","FACU","UPL"];
const W={OBL:1,FACW:2,FAC:3,FACU:4,UPL:5};
/* Matching key: letters and digits only, so "Typha X glauca", "Typha ×glauca" and "typha xglauca" all match,
   and "cattail" matches "Cat-Tail". Same rule as norm() in tools/build_species.py. */
const key=s=>String(s??"").toLowerCase().replace(/×/g,"x").replace(/[^a-z0-9]/g,"");
let SPP=[],SPP_IDX=new Map(),LIST=null;
async function loadSpecies(){
  try{
    const r=await fetch("species.json");if(!r.ok)throw new Error(r.status);
    const d=await r.json();LIST=d.version;
    SPP=d.species.map(([sci,com,s])=>({sci,com,s,k:key(sci),kc:key(com),syn:[]}));
    SPP.forEach(x=>SPP_IDX.set(x.k,x));
    const comN=new Map();SPP.forEach(x=>{if(x.kc)comN.set(x.kc,(comN.get(x.kc)||0)+1)});
    SPP.forEach(x=>{if(x.kc&&comN.get(x.kc)===1&&!SPP_IDX.has(x.kc))SPP_IDX.set(x.kc,x)}); // shared common names need picking from the list
    (d.synonyms||[]).forEach(([old,acc])=>{const x=SPP_IDX.get(key(acc));if(x){x.syn.push(old);if(!SPP_IDX.has(key(old)))SPP_IDX.set(key(old),x)}});
  }catch(e){LIST=null;toast("Couldn’t load the species list. Statuses won’t fill in automatically.")}
}
const listLabel=()=>LIST?LIST.label:"No species list loaded";
function searchSpp(q,limit=40){
  const k=key(q);if(!k)return[];
  const words=q.toLowerCase().replace(/×/g,"x").split(/[^a-z0-9]+/).filter(Boolean);
  const wordHit=txt=>{const ws=txt.toLowerCase().replace(/×/g,"x").split(/[^a-z0-9]+/);return words.every(w=>ws.some(t=>t.startsWith(w)))};
  const out=[];
  for(const x of SPP){
    let sc=-1,via="";
    const synK=x.syn.map(key);
    if(x.k===k||x.kc===k)sc=0;
    else if(synK.includes(k)){sc=0;via=x.syn[synK.indexOf(k)]}
    else if(x.k.startsWith(k))sc=1;
    else if(x.kc.startsWith(k))sc=2;
    else if(wordHit(x.sci))sc=3;
    else if(wordHit(x.sci+" "+x.com))sc=3.5;
    else{const i=synK.findIndex(s=>s.startsWith(k));if(i>=0){sc=3;via=x.syn[i]}
      else if(x.k.includes(k)||x.kc.includes(k))sc=4;
      else{const j=synK.findIndex(s=>s.includes(k));if(j>=0){sc=5;via=x.syn[j]}}}
    if(sc>=0)out.push({x,sc,via});
  }
  return out.sort((a,b)=>a.sc-b.sc||a.x.sci.localeCompare(b.x.sci)).slice(0,limit);
}

/* ---------- Form vocab (Midwest Region data form) ---------- */
const COUNTIES=["Cook","DuPage","Kane","Kendall","Lake","McHenry","Will","Grundy","DeKalb"];
const STRATA=[
  {k:"tree",name:"Tree stratum",plot:"30 ft radius"},
  {k:"shrub",name:"Sapling/shrub stratum",plot:"15 ft radius"},
  {k:"herb",name:"Herb stratum",plot:"5 ft radius"},
  {k:"vine",name:"Woody vine stratum",plot:"30 ft radius"}];
const SOIL_IND=[["A1","Histosol"],["A2","Histic epipedon"],["A3","Black histic"],["A4","Hydrogen sulfide"],["A5","Stratified layers"],["A10","2 cm muck"],["A11","Depleted below dark surface"],["A12","Thick dark surface"],["S1","Sandy mucky mineral"],["S4","Sandy gleyed matrix"],["S5","Sandy redox"],["S6","Stripped matrix"],["F1","Loamy mucky mineral"],["F2","Loamy gleyed matrix"],["F3","Depleted matrix"],["F6","Redox dark surface"],["F7","Depleted dark surface"],["F8","Redox depressions"]];
const SOIL_PROB=[["A16","Coast prairie redox"],["S7","Dark surface"],["F12","Iron-manganese masses"],["TF12","Very shallow dark surface"],["OTHER","Other (explain in remarks)"]];
const HYD_P=[["A1","Surface water"],["A2","High water table"],["A3","Saturation"],["B1","Water marks"],["B2","Sediment deposits"],["B3","Drift deposits"],["B4","Algal mat or crust"],["B5","Iron deposits"],["B7","Inundation visible on aerial imagery"],["B8","Sparsely vegetated concave surface"],["B9","Water-stained leaves"],["B13","Aquatic fauna"],["B14","True aquatic plants"],["C1","Hydrogen sulfide odor"],["C3","Oxidized rhizospheres on living roots"],["C4","Presence of reduced iron"],["C6","Recent iron reduction in tilled soils"],["C7","Thin muck surface"],["D9","Gauge or well data"],["OTHER","Other (explain in remarks)"]];
const HYD_S=[["B6","Surface soil cracks"],["B10","Drainage patterns"],["C2","Dry-season water table"],["C8","Crayfish burrows"],["C9","Saturation visible on aerial imagery"],["D1","Stunted or stressed plants"],["D2","Geomorphic position"],["D5","FAC-neutral test"]];
const TABS=[["site","Site"],["veg","Vegetation"],["soil","Soil"],["hydro","Hydrology"],["photos","Photos"],["summary","Summary"]];

/* ---------- Storage (IndexedDB, falls back to memory) ---------- */
let idb=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("wetland-form",2);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("points"))d.createObjectStore("points",{keyPath:"id"});if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta")};
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function dbAll(){return new Promise(res=>{if(!idb)return res([]);try{const q=idb.transaction("points").objectStore("points").getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}
/* Resolves true only once the write is committed to disk. A full disk shows up as an aborted transaction
   (QuotaExceededError), which a try/catch alone never sees, so failures are tracked and retried. */
function dbPut(p){return new Promise(res=>{
  if(!idb)return res(false);
  try{const tx=idb.transaction("points","readwrite");tx.objectStore("points").put(p);
    tx.oncomplete=()=>{failedIds.delete(p.id);if(!failedIds.size&&saveErr){saveErr=null;updateRisk()}res(true)};
    tx.onabort=()=>{saveFailed(p.id,tx.error);res(false)}}
  catch(e){saveFailed(p.id,e);res(false)}})}
function dbDel(id){if(!idb)return;try{idb.transaction("points","readwrite").objectStore("points").delete(id)}catch(e){}}
function metaGet(k){return new Promise(res=>{if(!idb)return res(null);try{const q=idb.transaction("meta").objectStore("meta").get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function metaSet(k,v){if(!idb)return;try{idb.transaction("meta","readwrite").objectStore("meta").put(v,k)}catch(e){}}
let saveErr=null;const failedIds=new Set();
function saveFailed(id,e){failedIds.add(id);const s=String((e&&e.name)||"")+" "+String((e&&e.message)||"");
  saveErr={quota:/quota/i.test(s),msg:(e&&e.message)||(e&&e.name)||"unknown error"};updateRisk();checkStorage()}
setInterval(()=>{if(failedIds.size)flushSave()},30000); // keep retrying failed saves (e.g. after space is freed)

/* ---------- State ---------- */
let points=[],cur=null,tab="site",saveT=null;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function blank(n){
  const today=new Date().toISOString().slice(0,10);
  return {id:uid(),created:Date.now(),
    site:{point:"DP-"+n,project:"",county:"Lake",date:today,owner:"",investigator:"",str:"",landform:"",relief:"none",slope:"",lat:"",lon:"",datum:"WGS84",mapunit:"",nwi:"",typical:"yes",sigDist:"no",natProb:"no",normal:"yes",remarks:""},
    veg:{tree:[],shrub:[],herb:[row()],vine:[],morph:false,remarks:""},
    soil:{layers:[layer()],ind:{},restr:"",restrDepth:"",remarks:""},
    hydro:{p:{},s:{},surf:"",wt:"",sat:"",remarks:""},
    photos:[]};
}
function row(){return {sp:"",cover:"",st:"",nl:false}}
function layer(){return {top:"",bot:"",mc:"",mp:"",rc:"",rp:"",rt:"",rl:"",tex:"",rem:""}}
const P=()=>points.find(p=>p.id===cur);
/* Edits are written 350 ms after the last change, and immediately when the app is hidden or closed. */
const dirty=new Set();
function save(){const p=P();if(p){p.modified=Date.now();dirty.add(p.id)}clearTimeout(saveT);saveT=setTimeout(flushSave,350)}
function flushSave(){clearTimeout(saveT);const ids=new Set([...dirty,...failedIds]);dirty.clear();
  return Promise.all([...ids].map(id=>{const p=points.find(x=>x.id===id);if(!p){failedIds.delete(id);return true}return dbPut(p)}))}
addEventListener("pagehide",flushSave);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushSave();else checkStorage()});
function getPath(o,path){return path.split(".").reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,path,v){const ks=path.split(".");const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Calculations ---------- */
function stratumCalc(rows){
  const r=rows.map((x,i)=>({...x,i,c:parseFloat(x.cover)||0})).filter(x=>x.c>0&&x.sp.trim());
  const tot=r.reduce((a,x)=>a+x.c,0);
  const sorted=[...r].sort((a,b)=>b.c-a.c);
  const fifty=tot*.5,twenty=tot*.2,dom=new Set();
  let cum=0,lastC=null;
  for(const x of sorted){
    if(cum>fifty){if(x.c===lastC)dom.add(x.i);else break}
    else{dom.add(x.i);cum+=x.c;lastC=x.c}
  }
  sorted.forEach(x=>{if(x.c>=twenty)dom.add(x.i)});
  return {tot,fifty,twenty,dom,rows:r};
}
function vegCalc(p){
  const per={};let doms=[],all=[];
  STRATA.forEach(s=>{const c=stratumCalc(p.veg[s.k]);per[s.k]=c;c.rows.forEach(x=>{all.push(x);if(c.dom.has(x.i))doms.push(x)})});
  const nDom=doms.length;
  const nWet=doms.filter(x=>["OBL","FACW","FAC"].includes(x.st)).length;
  const domPct=nDom?nWet/nDom*100:null;
  const rapid=nDom>0&&doms.every(x=>x.st==="OBL"||x.st==="FACW");
  const sums={OBL:0,FACW:0,FAC:0,FACU:0,UPL:0};
  all.forEach(x=>{if(sums[x.st]!=null)sums[x.st]+=x.c});
  const totC=Object.values(sums).reduce((a,b)=>a+b,0);
  const pi=totC?Object.entries(sums).reduce((a,[k,v])=>a+v*W[k],0)/totC:null;
  return {per,nDom,nWet,domPct,rapid,sums,totC,pi,any:all.length>0};
}
function soilCalc(p){
  const on=[...SOIL_IND,...SOIL_PROB].filter(([k])=>p.soil.ind[k]).map(([k])=>k);
  const has=p.soil.layers.some(l=>l.top!==""||l.mc);
  return {on,v:on.length?"yes":(has?"no":"na"),prob:on.some(k=>SOIL_PROB.some(([j])=>j===k))};
}
function hydroCalc(p){
  const np=HYD_P.filter(([k])=>p.hydro.p[k]).length, ns=HYD_S.filter(([k])=>p.hydro.s[k]).length;
  const touched=np||ns||p.hydro.surf||p.hydro.wt||p.hydro.sat;
  return {np,ns,v:(np>=1||ns>=2)?"yes":(touched?"no":"na")};
}
function determine(p){
  const vc=vegCalc(p),sc=soilCalc(p),hc=hydroCalc(p);
  let veg="na",via="";
  if(vc.any){
    if(vc.rapid){veg="yes";via="Rapid test (all dominants OBL or FACW)"}
    else if(vc.domPct>50){veg="yes";via="Dominance test (>50% OBL, FACW, FAC)"}
    else if(sc.v==="yes"&&hc.v==="yes"&&vc.pi!=null&&vc.pi<=3){veg="yes";via="Prevalence index ≤ 3.0"}
    else if(sc.v==="yes"&&hc.v==="yes"&&p.veg.morph){veg="yes";via="Morphological adaptations"}
    else{veg="no";via=(vc.pi!=null&&vc.pi<=3)?"Prevalence index passes, but it applies only when hydric soil and wetland hydrology are both present":"No hydrophytic vegetation indicator met"}
  }
  const vals=[veg,sc.v,hc.v];
  const wet=vals.includes("no")?"no":vals.every(v=>v==="yes")?"yes":"na";
  return {vc,sc,hc,veg,via,wet};
}

/* ---------- Offline map data: SSURGO soils (tools/build_soils.py) and NWI wetlands (tools/build_nwi.py) ---------- */
/* Each dataset is a folder with index.json, a polygon .bin file and JSON lookups. The page downloads it into its own
   cache ("wetland-<folder>-<build>") and reads it from there, so lookups and the map overlays work offline. */
const DS={
  soils:{dir:"soils",bin:"ssurgo.bin",json:{mu:"mapunits.json"},label:"Soil data (SSURGO)"},
  nwi:{dir:"nwi",bin:"nwi.bin",json:{codes:"codes.json",projects:"projects.json"},label:"NWI wetland data"}};
Object.values(DS).forEach(d=>Object.assign(d,{idx:null,cache:null,data:null,loading:null,state:"checking",pct:0,err:""}));
const dsURL=(d,f)=>new URL(d.dir+"/"+f,location.href).href;
const dsPrefix=d=>`wetland-${d.dir}-`;
async function dsInit(d){
  try{
    if(!("caches" in window))throw new Error("This browser can’t keep map data offline.");
    for(const name of (await caches.keys()).filter(n=>n.startsWith(dsPrefix(d)))){ // index.json is written last, so it marks a complete download
      const r=await (await caches.open(name)).match(dsURL(d,"index.json"));
      if(r&&!d.idx){d.idx=await r.json();d.cache=name}else if(!r)await caches.delete(name);
    }
    d.state=d.idx?"ready":"missing";updateDataStatus();
    let remote=null;
    try{const r=await fetch(dsURL(d,"index.json"),{cache:"no-store"});if(r.ok)remote=await r.json()}catch(e){}
    if(remote&&(!d.idx||remote.build!==d.idx.build))await dsDownload(d,remote);
  }catch(e){d.state=d.idx?"ready":"error";d.err=e.message||String(e)}
  updateDataStatus();
  if(d.state==="ready"){refreshMapData();const p=P();if(p)runLookups(p)}
}
async function dsDownload(d,idx){
  const name=dsPrefix(d)+idx.build,cache=await caches.open(name);
  d.state="downloading";d.pct=0;updateDataStatus();
  try{
    const total=Object.values(idx.files).reduce((a,b)=>a+b,0);let got=0;
    for(const f of Object.keys(idx.files)){
      const res=await fetch(dsURL(d,f)+"?b="+idx.build,{cache:"no-store"});
      if(!res.ok)throw new Error(`${f}: HTTP ${res.status}`);
      const rd=res.body.getReader(),parts=[];
      for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;d.pct=Math.min(99,Math.round(got/total*100));updateDataStatus()}
      await cache.put(dsURL(d,f),new Response(new Blob(parts),{headers:{"Content-Type":f.endsWith(".json")?"application/json":"application/octet-stream"}}));
    }
    await cache.put(dsURL(d,"index.json"),new Response(JSON.stringify(idx),{headers:{"Content-Type":"application/json"}}));
    for(const n of await caches.keys())if(n.startsWith(dsPrefix(d))&&n!==name)await caches.delete(n);
    Object.assign(d,{idx,cache:name,data:null,state:"ready"});
  }catch(e){await caches.delete(name);d.state=d.idx?"ready":"error";d.err="Download failed: "+(e.message||e)}
}
async function dsFile(d,f,type){
  if(d.cache){const r=await (await caches.open(d.cache)).match(dsURL(d,f));if(r)return r[type]()}
  const r=await fetch(dsURL(d,f));if(!r.ok)throw new Error(`${d.label} isn’t downloaded yet. Connect to the internet once to get it.`);
  return r[type]();
}
async function dsLoad(d){
  if(d.data)return d.data;
  if(!d.loading)d.loading=(async()=>{
    const js=Object.entries(d.json);
    const [buf,...vals]=await Promise.all([dsFile(d,d.bin,"arrayBuffer"),...js.map(([,f])=>dsFile(d,f,"json"))]);
    const H=new Int32Array(buf,0,16);if(H[0]!==0x31475353||H[1]!==1)throw new Error("Unrecognised map data file.");
    const D={H,u8:new Uint8Array(buf),arcOff:new Uint32Array(buf,H[7],H[4]),polyOff:new Uint32Array(buf,H[9],H[5]),
      bbox:new Int32Array(buf,H[11],H[5]*4),keys:new Uint32Array(buf,H[12],H[6]),geo:new Map()};
    js.forEach(([k],i)=>D[k]=vals[i]);
    return d.data=D;
  })().finally(()=>{d.loading=null});
  return d.loading;
}
function dsPoly(D,i){ // one polygon as rings of [x,y,x,y,...] in 1e-6 degree units relative to the file origin
  const u8=D.u8;let pos;
  const rv=()=>{let v=0,s=1,c;do{c=u8[pos++];v+=(c&127)*s;s*=128}while(c>127);return v};
  const zz=v=>v%2?-(v+1)/2:v/2;
  pos=D.H[10]+D.polyOff[i];const mi=rv(),nr=rv(),rings=[];
  for(let r=0;r<nr;r++){const na=rv(),ring=[];
    for(let a=0;a<na;a++){const rf=rv(),save=pos;pos=D.H[8]+D.arcOff[Math.floor(rf/2)];
      const n=rv(),pts=[];let x=0,y=0;for(let k=0;k<n;k++){x+=zz(rv());y+=zz(rv());pts.push(x,y)}
      pos=save;
      if(rf%2)for(let k=n-1;k>0;k--)ring.push(pts[2*k],pts[2*k+1]);else for(let k=0;k<n-1;k++)ring.push(pts[2*k],pts[2*k+1]);
    }rings.push(ring)}
  return {key:D.keys[mi],rings};
}
function dsCandidates(D,lat,lon,R){ // polygons within R metres: inside?, distance to their boundary
  const H=D.H,x=Math.round(lon*1e6)-H[2],y=Math.round(lat*1e6)-H[3];
  const kx=111320*Math.cos(lat*Math.PI/180)/1e6,ky=110574/1e6,rx=R/kx,ry=R/ky,out=[];
  for(let i=0;i<H[5];i++){const b=i*4;if(x>=D.bbox[b]-rx&&x<=D.bbox[b+2]+rx&&y>=D.bbox[b+1]-ry&&y<=D.bbox[b+3]+ry){
    const p=dsPoly(D,i);let ins=false,d=Infinity;
    for(const r of p.rings){const n=r.length;
      for(let j=0,k=n-2;j<n;k=j,j+=2){const x1=r[k],y1=r[k+1],x2=r[j],y2=r[j+1];
        if((y1>y)!==(y2>y)&&x<(x2-x1)*(y-y1)/(y2-y1)+x1)ins=!ins;
        const ax=(x1-x)*kx,ay=(y1-y)*ky,dx=(x2-x1)*kx,dy=(y2-y1)*ky,L=dx*dx+dy*dy;
        const t=L?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/L)):0;d=Math.min(d,Math.hypot(ax+t*dx,ay+t*dy))}}
    out.push({i,key:p.key,ins,d})}}
  return out;
}
function dsInView(D,w,s,e,n,max){
  const H=D.H,x0=w*1e6-H[2],x1=e*1e6-H[2],y0=s*1e6-H[3],y1=n*1e6-H[3],out=[];
  for(let i=0;i<H[5]&&out.length<max;i++){const b=i*4;if(D.bbox[b]<=x1&&D.bbox[b+2]>=x0&&D.bbox[b+1]<=y1&&D.bbox[b+3]>=y0)out.push(i)}
  return out;
}
function ptInRing(pt,r){let c=false;for(let j=0,k=r.length-1;j<r.length;k=j++){const [x1,y1]=r[k],[x2,y2]=r[j];if((y1>pt[1])!==(y2>pt[1])&&pt[0]<(x2-x1)*(pt[1]-y1)/(y2-y1)+x1)c=!c}return c}
function dsGeometry(D,i){ // GeoJSON geometry; rings nested by containment so holes and separate parts draw correctly
  if(D.geo.has(i))return D.geo.get(i);
  const ox=D.H[2],oy=D.H[3];
  const R=dsPoly(D,i).rings.map(r=>{const c=[];for(let k=0;k<r.length;k+=2)c.push([(r[k]+ox)/1e6,(r[k+1]+oy)/1e6]);c.push(c[0]);return c});
  let g;
  if(R.length===1)g={type:"Polygon",coordinates:R};
  else{
    const area=r=>Math.abs(r.reduce((s,p,k)=>k?s+r[k-1][0]*p[1]-p[0]*r[k-1][1]:0,0));
    const depth=R.map((r,a)=>R.reduce((n,o,b)=>n+(b!==a&&ptInRing(r[0],o)?1:0),0));
    const outers=R.map((r,a)=>a).filter(a=>depth[a]%2===0),polys=outers.map(a=>[R[a]]);
    R.forEach((r,a)=>{if(depth[a]%2){let best=-1,ba=Infinity;outers.forEach((o,j)=>{if(ptInRing(r[0],R[o])&&area(R[o])<ba){ba=area(R[o]);best=j}});if(best>=0)polys[best].push(r)}});
    g={type:"MultiPolygon",coordinates:polys};
  }
  if(D.geo.size>20000)D.geo.clear();
  D.geo.set(i,g);return g;
}

/* ---------- NWI codes in plain English (Cowardin et al. 1979; FGDC Wetlands Classification Standard) ---------- */
const NWI={
  sys:{M:"Marine",E:"Estuarine",R:"Riverine",L:"Lacustrine",P:"Palustrine"},
  sub:{M:{1:"Subtidal",2:"Intertidal"},E:{1:"Subtidal",2:"Intertidal"},R:{1:"Tidal",2:"Lower Perennial",3:"Upper Perennial",4:"Intermittent",5:"Unknown Perennial"},L:{1:"Limnetic",2:"Littoral"}},
  cls:{RB:"Rock Bottom",UB:"Unconsolidated Bottom",AB:"Aquatic Bed",RF:"Reef",SB:"Streambed",RS:"Rocky Shore",US:"Unconsolidated Shore",ML:"Moss-Lichen",EM:"Emergent",SS:"Scrub-Shrub",FO:"Forested",OW:"Open Water"},
  subcls:{RB:{1:"Bedrock",2:"Rubble"},UB:{1:"Cobble-Gravel",2:"Sand",3:"Mud",4:"Organic"},AB:{1:"Algal",2:"Aquatic Moss",3:"Rooted Vascular",4:"Floating Vascular",5:"Unknown Submergent",6:"Unknown Surface"},
    RF:{1:"Coral",2:"Mollusk",3:"Worm"},SB:{1:"Bedrock",2:"Rubble",3:"Cobble-Gravel",4:"Sand",5:"Mud",6:"Organic",7:"Vegetated"},RS:{1:"Bedrock",2:"Rubble"},
    US:{1:"Cobble-Gravel",2:"Sand",3:"Mud",4:"Organic",5:"Vegetated"},ML:{1:"Moss",2:"Lichen"},EM:{1:"Persistent",2:"Nonpersistent",5:"Phragmites australis"},
    SS:{1:"Broad-leaved Deciduous",2:"Needle-leaved Deciduous",3:"Broad-leaved Evergreen",4:"Needle-leaved Evergreen",5:"Dead",6:"Deciduous",7:"Evergreen"}},
  reg:{A:"Temporarily Flooded",B:"Seasonally Saturated",C:"Seasonally Flooded",D:"Continuously Saturated",E:"Seasonally Flooded/Saturated",F:"Semipermanently Flooded",
    G:"Intermittently Exposed",H:"Permanently Flooded",J:"Intermittently Flooded",K:"Artificially Flooded",L:"Subtidal",M:"Irregularly Exposed",N:"Regularly Flooded",
    P:"Irregularly Flooded",R:"Seasonally Flooded-Tidal",S:"Temporarily Flooded-Tidal",T:"Semipermanently Flooded-Tidal",V:"Permanently Flooded-Tidal",U:"Unknown"},
  mod:{b:"Beaver",d:"Partly Drained/Ditched",f:"Farmed",h:"Diked/Impounded",m:"Managed",r:"Artificial Substrate",s:"Spoil",x:"Excavated",
    a:"Acid",t:"Circumneutral",i:"Alkaline",g:"Organic Soil",n:"Mineral Soil",0:"Fresh",1:"Hyperhaline",2:"Euhaline",3:"Mixohaline",4:"Polyhaline",5:"Mesohaline",6:"Oligohaline",7:"Hypersaline",8:"Eusaline",9:"Mixosaline"}};
NWI.subcls.FO=NWI.subcls.SS;
function nwiParse(code){
  const s=String(code||"").trim();let i=0;const o={sys:s[0],sub:null,cls:[],reg:null,mods:[]};
  if(!NWI.sys[o.sys])return null;i=1;
  if(o.sys!=="P"&&/[0-9]/.test(s[i]||"")&&NWI.sub[o.sys]&&NWI.sub[o.sys][s[i]])o.sub=s[i++];
  const cls=()=>{const c=s.slice(i,i+2);if(!NWI.cls[c])return null;i+=2;const x={c};if(/[0-9]/.test(s[i]||""))x.n=s[i++];return x};
  let c=cls();
  if(c){o.cls.push(c);while(s[i]==="/"){i++;if(/[0-9]/.test(s[i]||""))o.cls.push({c:c.c,n:s[i++]});else{const c2=cls();if(!c2)return null;o.cls.push(c2);c=c2}}}
  if(NWI.reg[s[i]]&&/[A-Z]/.test(s[i]))o.reg=s[i++];
  for(;i<s.length;i++){if(!NWI.mod[s[i]])return null;o.mods.push(s[i])}
  return o;
}
function nwiDescribe(code){
  const o=nwiParse(code);if(!o)return {short:`Code ${code} (not recognised; see the NWI code key)`,parts:[]};
  const lc=x=>x.toLowerCase(),C=o.cls.map(x=>x.c),sub=o.sub&&NWI.sub[o.sys][o.sub];
  const clsTxt=[...new Set(C)].map(c=>lc(NWI.cls[c])).join(" / ");
  const subTxt=o.cls.filter(x=>x.n&&NWI.subcls[x.c]&&NWI.subcls[x.c][x.n]).map(x=>NWI.subcls[x.c][x.n]).map(t=>/^[A-Z][a-z]+ [a-z]+$/.test(t)?t:lc(t)).join(" / ");
  let noun;
  if(o.sys==="P"){
    const kind={EM:"emergent",FO:"forested",SS:"scrub-shrub",ML:"moss-lichen"};
    const veg=[...new Set(C.filter(c=>kind[c]).map(c=>kind[c]))];
    if(veg.length)noun=`freshwater ${veg.join(" / ")} wetland`;
    else if(C.some(c=>c==="UB"||c==="AB"||c==="RB"||c==="OW"))noun=`freshwater pond (${clsTxt})`;
    else if(C.length)noun=`freshwater ${clsTxt}`;
    else noun="freshwater wetland";
  }else if(o.sys==="L")noun=`lake${sub?`, ${o.sub==="1"?"deep-water zone":"shallow edge"} (${lc(sub)})`:""}${clsTxt?`, ${clsTxt}`:""}`;
  else if(o.sys==="R")noun=`${sub?lc(sub)+" ":""}river or stream${clsTxt?` (${clsTxt})`:""}`;
  else noun=`${lc(NWI.sys[o.sys])}${sub?" "+lc(sub):""}${clsTxt?` ${clsTxt}`:""}`;
  if(subTxt&&o.sys==="P"&&C.some(c=>c in {EM:1,FO:1,SS:1}))noun+=` (${subTxt})`;
  const bits=[noun,o.reg?lc(NWI.reg[o.reg]):"",...o.mods.map(m=>lc(NWI.mod[m]))].filter(Boolean);
  const short=bits.join(", ");
  const parts=[[o.sys,NWI.sys[o.sys]]];
  if(o.sub)parts.push([o.sub,sub]);
  o.cls.forEach(x=>{parts.push([x.c,NWI.cls[x.c]]);if(x.n)parts.push([x.n,(NWI.subcls[x.c]||{})[x.n]||"?"])});
  if(o.reg)parts.push([o.reg,NWI.reg[o.reg]]);
  o.mods.forEach(m=>parts.push([m,NWI.mod[m]]));
  return {short:short[0].toUpperCase()+short.slice(1),parts};
}

/* ---------- Point lookups (Site tab) ---------- */
async function lookupSoil(lat,lon){
  const D=await dsLoad(DS.soils),c=dsCandidates(D,lat,lon,30);
  let hit=c.find(x=>x.ins),gap=false;
  if(!hit){const n=c.filter(x=>x.d<=10).sort((a,b)=>a.d-b.d)[0];if(n){hit=n;gap=true}}
  if(!hit)return null;
  const nb=c.filter(x=>x.key!==hit.key&&x.d<=30).sort((a,b)=>a.d-b.d)[0];
  return {i:hit.i,mk:String(hit.key),boundary:hit.ins?hit.d:0,gap,nb:nb?{mk:String(nb.key),d:nb.d}:null};
}
async function lookupNwi(lat,lon){
  const D=await dsLoad(DS.nwi),c=dsCandidates(D,lat,lon,30);
  const proj=D.projects.filter(p=>p.rings.some(r=>ptInRing([lon,lat],r))).sort((a,b)=>(b.year||0)-(a.year||0))[0]||null;
  const hit=c.filter(x=>x.ins).sort((a,b)=>b.d-a.d)[0];
  const info=x=>{const [code,type]=D.codes[x.key];return {code,type,desc:nwiDescribe(code).short}};
  if(hit)return {i:hit.i,...info(hit),edge:Math.round(hit.d),proj};
  const n=c.sort((a,b)=>a.d-b.d)[0];
  return {none:true,covered:!!proj,near:n?{...info(n),d:Math.round(n.d)}:null,proj};
}

async function runLookups(p,manual){
  const lat=parseFloat(p.site.lat),lon=parseFloat(p.site.lon);
  if(!isFinite(lat)||!isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return;
  await Promise.all([runSoilLookup(p,lat,lon,manual),runNwiLookup(p,lat,lon,manual)]);
}

  const idx=d.idx||{},prevAuto=p.site.mapunitAuto;

    p.site.ssurgo={none:true,lat,lon,build:idx.build,areas:(idx.surveys||[]).map(s=>s.areaname.replace(/, Illinois$/,"")).join(", ")};
    if(p.site.mapunit&&p.site.mapunit===prevAuto){p.site.mapunit="";p.site.mapunitAuto=""}
  }else{
    const m=d.data.mu[r.mk]||{s:"?",n:"Map unit "+r.mk,c:[]},sv=(idx.surveys||[]).find(s=>s.areasymbol===m.a)||{},nm=r.nb&&d.data.mu[r.nb.mk];

      saversion:sv.saversion,saverest:sv.saverest,tabularversion:sv.tabularversion,tabularverest:sv.tabularverest,spatialversion:sv.spatialversion,
      boundary:Math.round(r.boundary),gap:r.gap,nb:nm?{musym:nm.s,muname:nm.n,d:Math.round(r.nb.d)}:null,build:idx.build,built:idx.built,at:Date.now()};
    const label=muLabel(m);

async function runNwiLookup(p,lat,lon,manual){

let viewPuts=0;
async function keepViewed(key,buf,type){ // tiles seen online stay available offline (capped, oldest dropped first)
  try{const c=await caches.open(VIEW_CACHE);await c.put(key,new Response(buf,{headers:{"Content-Type":type||"image/jpeg"}}));

let imgProtocolAdded=false;
function addImgProtocol(ml){ // img://<source>/<z>/<x>/<y>: downloaded area or viewed cache first, then the live service, else transparent
  if(imgProtocolAdded)return;imgProtocolAdded=true;
  ml.addProtocol("img",async(params,abort)=>{
    const m=params.url.match(/^img:\/\/(\w+)\/(\d+)\/(\d+)\/(\d+)/);if(!m)return emptyTile();
    const [,id,z,x,y]=m,key=tileKey(id,+z,+x,+y);
    try{const hit=await caches.match(key);if(hit)return hit.headers.get("X-Empty")?emptyTile():{data:await hit.arrayBuffer()}}catch(e){}
    if(navigator.onLine===false)return emptyTile();
    const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);abort.signal.addEventListener("abort",()=>c.abort());
    try{const r=await fetch(imgURL(IMG[id],+z,+x,+y),{signal:c.signal});
      if(!r.ok||!(r.headers.get("content-type")||"").match(/image|octet/))return emptyTile();
      const buf=await r.arrayBuffer();keepViewed(key,buf.slice(0),r.headers.get("content-type"));return {data:buf};
    }catch(e){if(abort.signal.aborted)throw e;return emptyTile()}finally{clearTimeout(t)}

const AREA_PREFIX="wetland-area-",AREA_META="https://tiles.offline/meta.json";

let areaJob=null;
function areaPlan(b,ids){
  const plan=[];let tiles=0,kb=0;
  for(const id of ids){const g=IMG[id];
    if(g.bounds&&(b[2]<g.bounds[0]||b[0]>g.bounds[2]||b[3]<g.bounds[1]||b[1]>g.bounds[3]))continue;
    const [z0,z1]=AREA_Z[id]||AREA_Z.county;let n=0;
    const bb=g.bounds?[Math.max(b[0],g.bounds[0]),Math.max(b[1],g.bounds[1]),Math.min(b[2],g.bounds[2]),Math.min(b[3],g.bounds[3])]:b;
    for(let z=z0;z<=z1;z++)n+=(lon2tx(bb[2],z)-lon2tx(bb[0],z)+1)*(lat2ty(bb[1],z)-lat2ty(bb[3],z)+1);
    plan.push({id,z0,z1,bb,n});tiles+=n;kb+=n*(AREA_KB[id]||25);
  }

}
const areaIdsForView=()=>["usgs","topo","naip",...["dupage","kane","lake","cook"]];
async function listAreas(){
  const out=[];
  for(const n of await caches.keys()){if(!n.startsWith(AREA_PREFIX))continue;
    const r=await (await caches.open(n)).match(AREA_META);
    if(r)out.push({cache:n,...await r.json()});else if(!areaJob||areaJob.cache!==n)await caches.delete(n); // unfinished download
  }
  return out.sort((a,b)=>b.created-a.created);
}
async function tileToResponse(bitmap,sx,sy){

  const g=cv.getContext("2d");g.clearRect(0,0,256,256);g.drawImage(bitmap,sx,sy,256,256,0,0,256,256);
  const d=g.getImageData(0,0,256,256).data;let clear=0,part=false;
  for(let i=3;i<d.length;i+=4){if(d[i]===0)clear++;else if(d[i]<255)part=true}
  if(clear===65536)return new Response("",{headers:{"X-Empty":"1"}});
  const type=clear||part?"image/png":"image/jpeg";
  const blob=cv.convertToBlob?await cv.convertToBlob({type,quality:.85}):await new Promise(r=>cv.toBlob(r,type,.85));
  return new Response(blob,{headers:{"Content-Type":type}});

async function downloadArea(name,b,ids){

  const job=areaJob={cache:cacheName,done:0,total:tiles,bytes:0,failed:0,ctl:new AbortController(),name};
  const jobs=[];
  for(const p of plan){const g=IMG[p.id];
    for(let z=p.z0;z<=p.z1;z++){
      const x0=lon2tx(p.bb[0],z),x1=lon2tx(p.bb[2],z),y0=lat2ty(p.bb[3],z),y1=lat2ty(p.bb[1],z);
      if(g.kind==="xyz"){for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)jobs.push({p,g,z,x,y,n:1})}
      else{const B=8;for(let bx=Math.floor(x0/B)*B;bx<=x1;bx+=B)for(let by=Math.floor(y0/B)*B;by<=y1;by+=B){
        const xs=Math.max(bx,x0),ys=Math.max(by,y0),xe=Math.min(bx+B-1,x1),ye=Math.min(by+B-1,y1),n=Math.max(xe-xs,ye-ys)+1;

        const r=await fetch(imgURL(j.g,j.z,j.x,j.y,j.n),{signal:job.ctl.signal,cache:"no-store"});
        if(!r.ok)throw new Error("HTTP "+r.status);

          await cache.put(tileKey(j.p.id,j.z,j.x,j.y),new Response(buf,{headers:{"Content-Type":r.headers.get("content-type")||"image/jpeg"}}));job.done++;return}
        const bm=await createImageBitmap(await r.blob());
        for(let x=j.x;x<=j.xe;x++)for(let y=j.y;y<=j.ye;y++){
          const res=await tileToResponse(bm,(x-j.x)*256,(y-j.y)*256);const blob=await res.clone().blob();job.bytes+=blob.size;

        bm.close&&bm.close();return;
      }catch(e){if(job.ctl.signal.aborted)throw e;if(attempt===2){job.failed+=j.g.kind==="xyz"?1:(j.xe-j.x+1)*(j.ye-j.y+1);job.done+=j.g.kind==="xyz"?1:(j.xe-j.x+1)*(j.ye-j.y+1)}

let refT=null;
function refreshMapData(){clearTimeout(refT);refT=setTimeout(refreshNow,120)}
async function refreshNow(){

  const z=map.getZoom(),b=map.getBounds(),[w,s,e,n]=[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()];
  const hints=[];
  const fill=async(key,src,minZ,props,on)=>{
    const d=DS[key];let feats=[];
    if(on&&z>=minZ&&(d.state==="ready"||d.data)){try{const D=await dsLoad(d);feats=dsInView(D,w,s,e,n,6000).map(i=>({type:"Feature",id:i,properties:{i,...props(D,i)},geometry:dsGeometry(D,i)}))}catch(err){}}

    map.getSource(src).setData({type:"FeatureCollection",features:feats});
  };
  await fill("soils","soils",12.5,(D,i)=>{const k=String(D.keys[dsPolyKey(D,i)]),m=D.mu[k]||{};return {k,s:m.s,h:m.h==null?-1:m.h}},mapPrefs.soils);
  await fill("nwi","nwi",11,(D,i)=>{const [c,t]=D.codes[D.keys[dsPolyKey(D,i)]];return {c,t}},mapPrefs.nwi);
  map.getSource("pts").setData({type:"FeatureCollection",features:points.filter(q=>q.id!==cur&&q.site.lat&&q.site.lon).map(q=>({type:"Feature",properties:{id:q.id,name:q.site.point||"Untitled"},geometry:{type:"Point",coordinates:[+q.site.lon,+q.site.lat]}}))});
  setHint(placing?`Tap the map to place ${P()?.site.point||"the point"}`:hints.length?`Zoom in to see ${hints.join(" and ")}`:"");
}
function dsPolyKey(D,i){let pos=D.H[10]+D.polyOff[i],v=0,s=1,c;do{c=D.u8[pos++];v+=(c&127)*s;s*=128}while(c>127);return v}

function updateMapPoint(){
  if(!mapReady)return;

async function onMapClick(e){

  else{
    const parts=[],sel=[];let imgHere="";

        imgHere=imageryAt(m.a)}

    if(mapPrefs.nwi&&(DS.nwi.state==="ready"||DS.nwi.data))try{const r=await lookupNwi(lat,lng);
      if(!r.none){sel.push(dsGeometry(DS.nwi.data,r.i));parts.push(`<div><span class="tag nwi">NWI</span><b>${esc(r.code)}</b> ${esc(r.desc)}${r.proj?`<br><small>${esc(projText(r.proj))}</small>`:""}</div>`)}
      else parts.push(`<div><span class="tag nwi">NWI</span>${r.covered?"Not in a mapped wetland":"Outside the offline NWI data"}</div>`)}catch(err){}
    map.getSource("sel").setData({type:"FeatureCollection",features:sel.map(g=>({type:"Feature",properties:{},geometry:g}))});
    box.innerHTML=(parts.join("")||'<div class="note">Turn on soils or NWI in Layers to see what is mapped here.</div>')+(imgHere?`<div><small>Basemap imagery here: ${esc(imgHere)}</small></div>`:"")+
      `<button class="btn quiet" data-place="1">Move ${esc(P()?.site.point||"point")} here</button>`;
  }

    if(t.dataset.place){mapPopup.remove();movePoint(lat,lng,"map tap")}
    if(t.dataset.open){mapPopup.remove();cur=t.dataset.open;renderAll();window.scrollTo(0,0)}});
  if(mapPopup)mapPopup.remove();

  mapPopup.on("close",()=>{if(map.getSource("sel"))map.getSource("sel").setData({type:"FeatureCollection",features:[]})});
}

/* ---------- Photos ---------- */
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
async function addPhotos(files){
  const p=P();let loc=null;
  try{loc=await new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(x=>r(x.coords),()=>r(null),{timeout:8000,enableHighAccuracy:true})})}catch(e){}
  for(const f of files){try{const data=await shrink(f);p.photos.push({data,caption:"",bearing:"",time:Date.now(),lat:loc?loc.latitude:(p.site.lat||""),lon:loc?loc.longitude:(p.site.lon||"")})}catch(e){toast("One photo couldn’t be read.")}}
  save();const ok=(await flushSave()).every(Boolean);renderPanel(); // photos are written straight away, not after the usual short delay
  toast(ok?`${files.length} photo${files.length>1?"s":""} added and saved`:"Photo NOT saved: the phone is out of space for this app. Back up now.");
  checkStorage();
}

function exportFile(name,data){

    const a=document.createElement("a");a.href=url;a.download=name;a.rel="noopener";a.style.display="none";

/* ---------- Data safety: storage checks, warnings, backup and restore ---------- */
const RISK={persisted:null,est:null,lastBackup:null,later:false};
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isInstalled=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const fmtB=b=>b>=1073741824?(b/1073741824).toFixed(1)+" GB":b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
let storT=0;
async function checkStorage(){
  try{if(navigator.storage&&navigator.storage.persisted)RISK.persisted=await navigator.storage.persisted()}catch(e){}
  try{if(navigator.storage&&navigator.storage.estimate)RISK.est=await navigator.storage.estimate()}catch(e){}
  updateRisk();
}
const freeMB=()=>RISK.est&&RISK.est.quota?(RISK.est.quota-RISK.est.usage)/1048576:null;
const unbacked=()=>points.filter(p=>p.modified&&(!RISK.lastBackup||p.modified>RISK.lastBackup));
function risks(){
  const out=[],f=freeMB();
  if(!idb)out.push(["bad","This browser isn’t saving your points (private browsing?). Back up before closing the app."]);
  if(saveErr)out.push(["bad",saveErr.quota?"Out of space: your latest changes are NOT saved on this phone. Back up now, then free space (delete offline areas, or free space on the phone).":`Your latest changes couldn’t be saved (${saveErr.msg}). Back up now.`]);
  if(f!=null&&f<150)out.push(["bad",`Only ${f.toFixed(0)} MB of storage left for this app, so new photos may not save. Back up, then delete offline areas or free space on the phone.`]);
  else if(RISK.est&&RISK.est.quota&&RISK.est.usage/RISK.est.quota>.85)out.push(["mid","This app has used most of the storage the browser allows it."]);
  const u=unbacked(),ph=u.reduce((a,p)=>a+p.photos.length,0),age=RISK.lastBackup?(Date.now()-RISK.lastBackup)/864e5:Infinity;
  if(u.length&&(RISK.persisted!==true||age>7))
    out.push(["mid",`${u.length} point${u.length>1?"s":""}${ph?` and ${ph} photo${ph>1?"s":""}`:""} not backed up${RISK.persisted!==true?". This browser hasn’t promised to keep them if space runs low":""}.`]);
  return out;
}
function updateRisk(){
  const el=document.getElementById("risk");if(!el)return;
  const r=risks().filter(x=>x[0]==="bad"||!RISK.later);
  if(!r.length){el.hidden=true;el.innerHTML="";return}
  const bad=r.some(x=>x[0]==="bad");
  el.hidden=false;el.className="risk "+(bad?"bad":"mid");
  el.innerHTML=`<span>${r.map(x=>esc(x[1])).join(" ")}</span><button class="btn" data-risk="backup">Back up now</button>${tab!=="device"?'<button class="btn quiet" data-risk="dev">Details</button>':""}${bad?"":'<button class="btn quiet" data-risk="later">Later</button>'}`;
}
document.getElementById("risk").addEventListener("click",e=>{const a=e.target.dataset.risk;
  if(a==="backup")backupNow(canShareFiles());
  if(a==="dev"){tab="device";renderTabs();renderPanel();window.scrollTo(0,0)}
  if(a==="later"){RISK.later=true;updateRisk()}});
const canShareFiles=()=>{try{return !!(navigator.canShare&&navigator.canShare({files:[new File(["{}"],"t.json",{type:"application/json"})]}))}catch(e){return false}};
const backupName=()=>`wetland_backup_${new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")}.json`;
function backupJSON(){return JSON.stringify({app:"wetland-form",kind:"backup",format:1,exported:new Date().toISOString(),species_list:LIST?LIST.label:null,points},null,1)}
function markBackedUp(){RISK.lastBackup=Date.now();RISK.later=false;metaSet("lastBackup",RISK.lastBackup);updateRisk();if(tab==="device")renderDevice()}
async function backupNow(share){
  await flushSave();const name=backupName(),data=backupJSON();
  if(share){
    try{await navigator.share({files:[new File([data],name,{type:"application/json"})],title:"Wetland form backup"});markBackedUp();toast("Backup sent");return}
    catch(e){if(e&&e.name==="AbortError")return;toast("Sharing didn’t work, so the backup is downloading instead.")}
  }
  if(exportFile(name,data))markBackedUp();
}
async function restoreFile(file){
  let data=null;try{data=JSON.parse(await file.text())}catch(e){}
  const list=Array.isArray(data)?data:data&&data.points; // also accepts the older “all points” download
  if(!Array.isArray(list)||!list.length||!list.every(p=>p&&p.id&&p.site&&p.veg&&p.soil&&p.hydro)){alert("That file isn’t a backup from this app.");return}
  const nPh=list.reduce((a,p)=>a+((p.photos||[]).length),0);
  if(!confirm(`Restore ${list.length} point${list.length>1?"s":""} and ${nPh} photo${nPh===1?"":"s"} from “${file.name}”?\n\nPoints already on this phone are kept. If a point is in both, the more recently edited copy is kept.`))return;
  await flushSave();
  let added=0,updated=0,kept=0,failed=0;
  for(const q of list){q.photos=q.photos||[];const i=points.findIndex(p=>p.id===q.id);
    const newer=i>=0&&(q.modified||q.created||0)>(points[i].modified||points[i].created||0);
    if(i>=0&&!newer){kept++;continue}
    if(!(await dbPut(q))){failed++;continue}
    if(i<0){points.push(q);added++}else{points[i]=q;updated++}}
  // the empty starter point made on first launch isn't needed once real points are back
  for(const p of points.filter(p=>!p.modified&&!p.site.lat&&!list.some(q=>q.id===p.id)))if(points.length>1){dbDel(p.id);points=points.filter(x=>x!==p)}
  points.sort((a,b)=>a.created-b.created);if(!points.some(p=>p.id===cur))cur=points[points.length-1].id;
  renderAll();checkStorage();
  alert(`Restore finished: ${added} added, ${updated} replaced with the newer backup copy, ${kept} already up to date on this phone.${failed?`\n\n${failed} couldn’t be saved; the phone may be out of space.`:""}`);
}
async function cacheSize(name,sample){ // bytes in a Cache Storage cache; large caches are estimated from a sample
  try{const c=await caches.open(name),ks=await c.keys();let b=0;const n=sample?Math.min(sample,ks.length):ks.length;
    for(const k of ks.slice(0,n)){const r=await c.match(k);if(r)b+=(await r.blob()).size}
    return {n:ks.length,bytes:n?b/n*ks.length:0}}catch(e){return {n:0,bytes:0}}
}
let pendingFit=null;
async function renderDevice(){
  const el=document.getElementById("devBody");if(!el)return;
  await checkStorage();
  const hasCaches="caches" in window,names=hasCaches?await caches.keys():[];
  const appName=names.find(n=>n.startsWith("wetland-app-")),app=appName?await cacheSize(appName):null;
  let appOk=false,sppOk=false;if(appName){const c=await caches.open(appName);appOk=!!(await c.match("./index.html"));sppOk=!!(await c.match("./species.json"))}
  const areas=hasCaches?await listAreas():[],viewed=hasCaches?await cacheSize(VIEW_CACHE,40):{n:0,bytes:0};
  const ptsBytes=new Blob([JSON.stringify(points)]).size,nPh=points.reduce((a,p)=>a+p.photos.length,0),u=unbacked();
  if(tab!=="device"||!document.getElementById("devBody"))return;
  const est=RISK.est,used=est&&est.usage,quota=est&&est.quota;
  const ds=d=>{const mb=d.idx?Object.values(d.idx.files).reduce((a,b)=>a+b,0):0;
    return [d.state==="ready"?`<span class="good">Ready offline</span> (built ${esc(d.idx.built)})`:d.state==="downloading"?`Downloading… ${d.pct}%`:`<span class="bad">Not on this phone yet</span>. Open the app once with internet to download it.`,mb?fmtB(mb):""]};
  const areaBytes=areas.reduce((a,x)=>a+(x.bytes||0),0);
  const rows=[
    ["The app itself (form, calculations, map)",appOk?`<span class="good">Ready offline</span> (version ${esc(appName.replace("wetland-app-",""))})`:'<span class="bad">Not saved yet</span>. Open the app once with internet.',app?fmtB(app.bytes):""],
    ["Plant list ("+esc(listLabel())+")",sppOk&&SPP.length?`<span class="good">Ready offline</span> (${SPP.length.toLocaleString()} species)`:'<span class="bad">Not saved yet</span>',""],
    ["Soils (SSURGO)",...ds(DS.soils)],["NWI wetlands",...ds(DS.nwi)],
    ["Imagery: downloaded project areas",areas.length?`<span class="good">${areas.length} area${areas.length>1?"s":""} ready offline</span>`:"None yet. Outside downloaded areas, imagery needs signal.",areaBytes?fmtB(areaBytes):""],
    ["Imagery: tiles you’ve already viewed",`${viewed.n.toLocaleString()} tiles kept (newest ${VIEW_LIMIT.toLocaleString()})${viewed.n?' <button class="btn quiet" id="clrViewed">Clear</button>':""}`,viewed.bytes?"about "+fmtB(viewed.bytes):""],
    ["Your points and photos",`<span class="good">Saved on this phone</span>: ${points.length} point${points.length>1?"s":""}, ${nPh} photo${nPh===1?"":"s"}`,fmtB(ptsBytes)]];
  const prot=RISK.persisted===true?'<span class="good">Protected.</span> The browser has agreed not to clear this app’s data when the phone runs low on space.'
    :RISK.persisted===false?`<span class="bad">Not protected.</span> If the phone runs low on space, the browser may clear this app’s data, including points and photos. ${isInstalled()?"Browsers usually grant protection to installed apps you use regularly; check again after a few days of use.":"Installing the app (Add to Home Screen) usually lets the browser grant protection."} Until then, back up after each field day. <button class="btn quiet" id="askPersist">Ask the browser again</button>`
    :"This browser doesn’t report whether it will keep the app’s data. Back up after each field day.";
  el.innerHTML=`${risks().length?`<p class="note warn">${risks().map(x=>esc(x[1])).join(" ")}</p>`:""}
  <h3>Your points and photos</h3>
  <p>Last backup: <b>${RISK.lastBackup?new Date(RISK.lastBackup).toLocaleString():"never"}</b>${u.length?` · <span class="bad">${u.length} point${u.length>1?"s":""} changed since</span>`:points.some(p=>p.modified)?' · <span class="good">all points backed up</span>':""}</p>
  <div class="row"><button class="btn primary" id="bkDown">Back up to a file</button>${canShareFiles()?'<button class="btn" id="bkShare">Send backup (Drive, email, Files…)</button>':""}
   <label class="btn quiet" style="display:inline-flex;align-items:center">Restore from a backup file<input type="file" id="bkIn" accept=".json,application/json" style="position:absolute;left:-9999px"></label></div>
  <p class="note">A backup is one file with every point, all form data and all photos. Keep it off the phone (Google Drive, iCloud, email to yourself). Restoring adds the points back without deleting anything already on the phone.</p>
  <p class="note">${prot}</p>
  ${isIOS&&!isInstalled()?'<p class="note warn">On iPhone and iPad, Safari deletes a website’s saved data after 7 days without a visit. Add this app to your Home Screen (Share › Add to Home Screen) and open it from there so that doesn’t happen.</p>':""}
  <h3>What works offline</h3>
  <table><tr><th>Item</th><th>Status on this phone</th><th class="n">Size</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="n">${r[2]}</td></tr>`).join("")}</table>
  <h3>Downloaded project areas</h3>
  ${areas.length?`<ul class="dareas">${areas.map(a=>`<li><div><b>${esc(a.name)}</b> <span class="sz">${fmtB(a.bytes||0)}</span></div>
    <small>Downloaded ${new Date(a.created).toLocaleDateString()} · ${a.sources.map(s=>esc(IMG[s.id]?IMG[s.id].label:s.label)).join(", ")}${a.failed?` · <span class="bad">${a.failed} tiles missing</span>`:""}</small>
    <div class="row"><button class="btn quiet" data-dshow="${a.cache}">Show on map</button><button class="btn quiet" data-ddel="${a.cache}">Delete</button></div></li>`).join("")}</ul>
    <p class="note">${areas.length} area${areas.length>1?"s":""}, ${fmtB(areaBytes)} in total.</p>`
    :'<p class="note">None yet.</p>'}
  <p class="note">To download an area: Site tab › zoom the map to your project › Offline areas › Download.</p>
  <h3>Phone storage</h3>
  ${est&&quota?`<div class="meter" aria-hidden="true"><span style="width:${Math.min(100,used/quota*100).toFixed(1)}%"></span></div>
    <p class="note">This app uses ${fmtB(used)} of the ${fmtB(quota)} the browser allows it (${fmtB(quota-used)} free).</p>`:'<p class="note">This browser doesn’t report storage use.</p>'}`;
}
main.addEventListener("click",async e=>{
  const t=e.target;if(tab!=="device")return;
  if(t.id==="bkDown")backupNow(false);
  if(t.id==="bkShare")backupNow(true);
  if(t.id==="askPersist"){try{await navigator.storage.persist()}catch(err){}await checkStorage();renderDevice();toast(RISK.persisted?"Storage is now protected":"The browser didn’t grant protection yet")}
  if(t.id==="clrViewed"&&confirm("Clear imagery you’ve viewed online? Downloaded project areas are kept.")){await caches.delete(VIEW_CACHE);renderDevice()}
  if(t.dataset.dshow){const a=(await listAreas()).find(x=>x.cache===t.dataset.dshow);if(a){pendingFit=a.bbox;tab="site";renderAll();window.scrollTo(0,0)}}
  if(t.dataset.ddel){const a=(await listAreas()).find(x=>x.cache===t.dataset.ddel);
    if(a&&confirm(`Delete the offline imagery for “${a.name}” (${fmtB(a.bytes||0)})? You can download it again later.`)){await caches.delete(a.cache);refreshAreaOutlines();renderDevice();toast("Area deleted")}}
});
main.addEventListener("change",e=>{if(e.target.id==="bkIn"&&e.target.files[0]){restoreFile(e.target.files[0]);e.target.value=""}});
addEventListener("appinstalled",()=>{try{navigator.storage.persist().then(checkStorage)}catch(e){}});

/* ---------- Misc ---------- */
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2400)}
function renderAll(){renderPointSel();renderTabs();renderPanel();renderStatus()}
(async()=>{
  idb=await openDB();
  await loadSpecies();
  Object.values(DS).forEach(dsInit); // background: checks for and downloads the offline soil and NWI data
  points=(await dbAll()).sort((a,b)=>a.created-b.created);
  if(!points.length){const p=blank(1);points.push(p);dbPut(p)}
  cur=points[points.length-1].id;renderAll();
  RISK.lastBackup=await metaGet("lastBackup");
  /* Ask the browser not to evict stored points and photos under storage pressure, then check and warn. */
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  checkStorage();setInterval(checkStorage,120000);
})();

/* ---------- Offline support (service worker) ---------- */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w)return;
        w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)toast("App updated. Reopen it to use the new version.")})});
    }).catch(()=>{});
  });
}
