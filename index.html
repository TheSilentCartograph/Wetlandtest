<html lang="en">

<style>
:root{
  --bg:#EEF1EC;--surface:#FFFFFF;--ink:#1C2A26;--muted:#56665F;--line:#C9D2CB;--soft:#E2E8E2;
  --gley:#3F6672;--gley-ink:#FFFFFF;--yes:#2C6A4C;--no:#A9502A;--na:#8A9690;
  --obl:#1F5E7A;--facw:#3B8A8D;--fac:#7E9C5E;--facu:#BB8F3F;--upl:#9E5F33;
  --focus:#2C7DA0;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141B19;--surface:#1D2623;--ink:#E4EBE6;--muted:#9DADA6;--line:#34423D;--soft:#26312D;
  --gley:#7FA7B3;--gley-ink:#0F1715;--yes:#6CC29A;--no:#E58A5E;--na:#7C8984;
  --obl:#5BA6C6;--facw:#62BDB9;--fac:#A7C487;--facu:#DDB36A;--upl:#D2905F;--focus:#7FC4E0;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141B19;--surface:#1D2623;--ink:#E4EBE6;--muted:#9DADA6;--line:#34423D;--soft:#26312D;
  --gley:#7FA7B3;--gley-ink:#0F1715;--yes:#6CC29A;--no:#E58A5E;--na:#7C8984;
  --obl:#5BA6C6;--facw:#62BDB9;--fac:#A7C487;--facu:#DDB36A;--upl:#D2905F;--focus:#7FC4E0;
  color-scheme:dark;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.bar h1{font-size:1.05rem;margin:0;font-weight:700;flex:1 1 auto;min-width:10rem}
.bar select{max-width:15rem}
.status{display:grid;grid-template-columns:repeat(4,1fr);max-width:1100px;margin:0 auto;border-top:1px solid var(--line)}
.factor{padding:.45rem .7rem;display:flex;flex-direction:column;gap:.1rem;border-right:1px solid var(--line)}
.factor:last-child{border-right:0}
.factor span{font-size:.78rem;color:var(--muted)}
.factor b{font-size:1rem}
.factor[data-v="yes"] b{color:var(--yes)}.factor[data-v="no"] b{color:var(--no)}.factor[data-v="na"] b{color:var(--na)}
.factor.final{background:var(--soft)}
nav.tabs{display:flex;overflow-x:auto;gap:.25rem;padding:.4rem 1rem;max-width:1100px;margin:0 auto;border-top:1px solid var(--line)}
nav.tabs button{border:0;background:none;padding:.45rem .8rem;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--gley);color:var(--gley-ink);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:1rem}
section.panel{display:none}section.panel.on{display:block}
h2{font-size:1.25rem;margin:.3rem 0 .8rem}
h3{font-size:1.02rem;margin:1.4rem 0 .5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.75rem 1rem}
label.f{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;width:100%;color:var(--ink);min-height:2.5rem}
textarea{min-height:4.5rem;resize:vertical}
.btn{border:1px solid var(--gley);background:var(--surface);color:var(--gley);padding:.5rem .9rem;border-radius:6px;cursor:pointer;font-weight:700;min-height:2.5rem}
.btn.primary{background:var(--gley);color:var(--gley-ink)}
.btn.quiet{border-color:var(--line);color:var(--muted);font-weight:400}
.btn.danger{border-color:var(--no);color:var(--no)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.note{font-size:.85rem;color:var(--muted);margin:.4rem 0}
.warn{color:var(--no)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:.35rem .45rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.8rem;color:var(--muted);font-weight:700;background:var(--soft)}
td input,td select{min-height:2.2rem;padding:.35rem .45rem}
td.num{width:6rem}
.stratum{margin-bottom:1.3rem}
.stratum header{all:unset;display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin:.2rem 0 .4rem}
.stratum h3{margin:0}
.calc{font-size:.85rem;color:var(--muted);padding:.45rem .6rem}
.dom{display:inline-block;font-size:.72rem;font-weight:700;padding:.08rem .4rem;border-radius:4px;background:var(--gley);color:var(--gley-ink)}
.nl{font-size:.72rem;color:var(--no)}
.ind{display:flex;align-items:center;gap:.35rem}
.ind i{width:.8rem;height:.8rem;border-radius:2px;flex:none;background:var(--na)}
.ind[data-s="OBL"] i{background:var(--obl)}.ind[data-s="FACW"] i{background:var(--facw)}.ind[data-s="FAC"] i{background:var(--fac)}.ind[data-s="FACU"] i{background:var(--facu)}.ind[data-s="UPL"] i{background:var(--upl)}
.scale{display:flex;height:.55rem;border-radius:3px;overflow:hidden;margin:.6rem 0 .25rem;background:var(--soft)}
.scale span{display:block;height:100%}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.tests{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.6rem;margin:.6rem 0}
.test{border:1px solid var(--line);border-left:4px solid var(--na);background:var(--surface);border-radius:6px;padding:.6rem .7rem}
.test[data-v="yes"]{border-left-color:var(--yes)}.test[data-v="no"]{border-left-color:var(--no)}
.test b{display:block}
.test small{color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.15rem 1rem}
.checks label{display:flex;gap:.55rem;align-items:flex-start;padding:.35rem 0;cursor:pointer}
.checks input{width:1.15rem;height:1.15rem;margin-top:.15rem;flex:none;accent-color:var(--gley)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.8rem}
.photo{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--soft)}
.photo .meta{padding:.5rem;display:flex;flex-direction:column;gap:.4rem;font-size:.8rem;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:1.2rem;color:var(--muted);text-align:center}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem}
.summary dl{display:grid;grid-template-columns:1fr auto;gap:.5rem 1rem;margin:0}
.summary dt{color:var(--muted)}.summary dd{margin:0;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:6px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
img{max-width:100%}
@media (max-width:640px){.status{grid-template-columns:repeat(2,1fr)}.factor:nth-child(2){border-right:0}.factor:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.sugg{position:absolute;z-index:20;max-height:min(22rem,50vh);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:.2rem 0}
.sugg[hidden]{display:none}
.sugg .opt{display:grid;grid-template-columns:1fr auto;gap:.1rem .6rem;align-items:center;padding:.5rem .7rem;cursor:pointer;min-height:2.75rem}
.sugg .opt[aria-selected="true"],.sugg .opt:hover{background:var(--soft)}
.sugg .opt i{font-style:italic}
.sugg .opt small{grid-column:1;color:var(--muted);font-size:.8rem}
.sugg .opt .ind{grid-row:1 / span 2;grid-column:2;font-size:.8rem;font-weight:700}
.sugg .none{padding:.6rem .7rem;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Wetland determination data form</h1>
    <label class="sr" for="pointSel" style="position:absolute;left:-9999px">Sampling point</label>
    <select id="pointSel"></select>
    <button class="btn primary" id="newPt">New point</button>
  </div>
  <div class="status" id="status"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sugg" id="sugg" role="listbox" aria-label="Matching species" hidden></div>

<script>
/* ---------- Species list: species.json, built from the official NWPL by tools/build_species.py ---------- */
const STATUSES=["OBL","FACW","FAC","FACU","UPL"];
const W={OBL:1,FACW:2,FAC:3,FACU:4,UPL:5};
/* Matching key: letters and digits only, so "Typha X glauca", "Typha ×glauca" and "typha xglauca" all match,
   and "cattail" matches "Cat-Tail". Same rule as norm() in tools/build_species.py. */
const key=s=>String(s??"").toLowerCase().replace(/×/g,"x").replace(/[^a-z0-9]/g,"");
let SPP=[],SPP_IDX=new Map(),LIST=null;
async function loadSpecies(){
  try{
    const r=await fetch("species.json");if(!r.ok)throw new Error(r.status);
    const d=await r.json();LIST=d.version;
    SPP=d.species.map(([sci,com,s])=>({sci,com,s,k:key(sci),kc:key(com),syn:[]}));
    SPP.forEach(x=>SPP_IDX.set(x.k,x));
    const comN=new Map();SPP.forEach(x=>{if(x.kc)comN.set(x.kc,(comN.get(x.kc)||0)+1)});
    SPP.forEach(x=>{if(x.kc&&comN.get(x.kc)===1&&!SPP_IDX.has(x.kc))SPP_IDX.set(x.kc,x)}); // shared common names need picking from the list
    (d.synonyms||[]).forEach(([old,acc])=>{const x=SPP_IDX.get(key(acc));if(x){x.syn.push(old);if(!SPP_IDX.has(key(old)))SPP_IDX.set(key(old),x)}});
  }catch(e){LIST=null;toast("Couldn’t load the species list. Statuses won’t fill in automatically.")}
}
const listLabel=()=>LIST?LIST.label:"No species list loaded";
function searchSpp(q,limit=40){
  const k=key(q);if(!k)return[];
  const words=q.toLowerCase().replace(/×/g,"x").split(/[^a-z0-9]+/).filter(Boolean);
  const wordHit=txt=>{const ws=txt.toLowerCase().replace(/×/g,"x").split(/[^a-z0-9]+/);return words.every(w=>ws.some(t=>t.startsWith(w)))};
  const out=[];
  for(const x of SPP){
    let sc=-1,via="";
    const synK=x.syn.map(key);
    if(x.k===k||x.kc===k)sc=0;
    else if(synK.includes(k)){sc=0;via=x.syn[synK.indexOf(k)]}
    else if(x.k.startsWith(k))sc=1;
    else if(x.kc.startsWith(k))sc=2;
    else if(wordHit(x.sci))sc=3;
    else if(wordHit(x.sci+" "+x.com))sc=3.5;
    else{const i=synK.findIndex(s=>s.startsWith(k));if(i>=0){sc=3;via=x.syn[i]}
      else if(x.k.includes(k)||x.kc.includes(k))sc=4;
      else{const j=synK.findIndex(s=>s.includes(k));if(j>=0){sc=5;via=x.syn[j]}}}
    if(sc>=0)out.push({x,sc,via});
  }
  return out.sort((a,b)=>a.sc-b.sc||a.x.sci.localeCompare(b.x.sci)).slice(0,limit);
}

/* ---------- Form vocab (Midwest Region data form) ---------- */
const COUNTIES=["Cook","DuPage","Kane","Kendall","Lake","McHenry","Will","Grundy","DeKalb"];
const STRATA=[
  {k:"tree",name:"Tree stratum",plot:"30 ft radius"},
  {k:"shrub",name:"Sapling/shrub stratum",plot:"15 ft radius"},
  {k:"herb",name:"Herb stratum",plot:"5 ft radius"},
  {k:"vine",name:"Woody vine stratum",plot:"30 ft radius"}];
const SOIL_IND=[["A1","Histosol"],["A2","Histic epipedon"],["A3","Black histic"],["A4","Hydrogen sulfide"],["A5","Stratified layers"],["A10","2 cm muck"],["A11","Depleted below dark surface"],["A12","Thick dark surface"],["S1","Sandy mucky mineral"],["S4","Sandy gleyed matrix"],["S5","Sandy redox"],["S6","Stripped matrix"],["F1","Loamy mucky mineral"],["F2","Loamy gleyed matrix"],["F3","Depleted matrix"],["F6","Redox dark surface"],["F7","Depleted dark surface"],["F8","Redox depressions"]];
const SOIL_PROB=[["A16","Coast prairie redox"],["S7","Dark surface"],["F12","Iron-manganese masses"],["TF12","Very shallow dark surface"],["OTHER","Other (explain in remarks)"]];
const HYD_P=[["A1","Surface water"],["A2","High water table"],["A3","Saturation"],["B1","Water marks"],["B2","Sediment deposits"],["B3","Drift deposits"],["B4","Algal mat or crust"],["B5","Iron deposits"],["B7","Inundation visible on aerial imagery"],["B8","Sparsely vegetated concave surface"],["B9","Water-stained leaves"],["B13","Aquatic fauna"],["B14","True aquatic plants"],["C1","Hydrogen sulfide odor"],["C3","Oxidized rhizospheres on living roots"],["C4","Presence of reduced iron"],["C6","Recent iron reduction in tilled soils"],["C7","Thin muck surface"],["D9","Gauge or well data"],["OTHER","Other (explain in remarks)"]];
const HYD_S=[["B6","Surface soil cracks"],["B10","Drainage patterns"],["C2","Dry-season water table"],["C8","Crayfish burrows"],["C9","Saturation visible on aerial imagery"],["D1","Stunted or stressed plants"],["D2","Geomorphic position"],["D5","FAC-neutral test"]];
const TABS=[["site","Site"],["veg","Vegetation"],["soil","Soil"],["hydro","Hydrology"],["photos","Photos"],["summary","Summary"]];

/* ---------- Storage (IndexedDB, falls back to memory) ---------- */
let idb=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("wetland-form",1);r.onupgradeneeded=()=>r.result.createObjectStore("points",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
function dbAll(){return new Promise(res=>{if(!idb)return res([]);try{const q=idb.transaction("points").objectStore("points").getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}
function dbPut(p){if(!idb)return;try{idb.transaction("points","readwrite").objectStore("points").put(p)}catch(e){toast("Couldn’t save to this browser. Export your data to keep it.")}}
function dbDel(id){if(!idb)return;try{idb.transaction("points","readwrite").objectStore("points").delete(id)}catch(e){}}

/* ---------- State ---------- */
let points=[],cur=null,tab="site",saveT=null;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function blank(n){
  const today=new Date().toISOString().slice(0,10);
  return {id:uid(),created:Date.now(),
    site:{point:"DP-"+n,project:"",county:"Lake",date:today,owner:"",investigator:"",str:"",landform:"",relief:"none",slope:"",lat:"",lon:"",datum:"WGS84",mapunit:"",nwi:"",typical:"yes",sigDist:"no",natProb:"no",normal:"yes",remarks:""},
    veg:{tree:[],shrub:[],herb:[row()],vine:[],morph:false,remarks:""},
    soil:{layers:[layer()],ind:{},restr:"",restrDepth:"",remarks:""},
    hydro:{p:{},s:{},surf:"",wt:"",sat:"",remarks:""},
    photos:[]};
}
function row(){return {sp:"",cover:"",st:"",nl:false}}
function layer(){return {top:"",bot:"",mc:"",mp:"",rc:"",rp:"",rt:"",rl:"",tex:"",rem:""}}
const P=()=>points.find(p=>p.id===cur);
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{const p=P();if(p)dbPut(p)},350)}
function getPath(o,path){return path.split(".").reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,path,v){const ks=path.split(".");const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Calculations ---------- */
function stratumCalc(rows){
  const r=rows.map((x,i)=>({...x,i,c:parseFloat(x.cover)||0})).filter(x=>x.c>0&&x.sp.trim());
  const tot=r.reduce((a,x)=>a+x.c,0);
  const sorted=[...r].sort((a,b)=>b.c-a.c);
  const fifty=tot*.5,twenty=tot*.2,dom=new Set();
  let cum=0,lastC=null;
  for(const x of sorted){
    if(cum>fifty){if(x.c===lastC)dom.add(x.i);else break}
    else{dom.add(x.i);cum+=x.c;lastC=x.c}
  }
  sorted.forEach(x=>{if(x.c>=twenty)dom.add(x.i)});
  return {tot,fifty,twenty,dom,rows:r};
}
function vegCalc(p){
  const per={};let doms=[],all=[];
  STRATA.forEach(s=>{const c=stratumCalc(p.veg[s.k]);per[s.k]=c;c.rows.forEach(x=>{all.push(x);if(c.dom.has(x.i))doms.push(x)})});
  const nDom=doms.length;
  const nWet=doms.filter(x=>["OBL","FACW","FAC"].includes(x.st)).length;
  const domPct=nDom?nWet/nDom*100:null;
  const rapid=nDom>0&&doms.every(x=>x.st==="OBL"||x.st==="FACW");
  const sums={OBL:0,FACW:0,FAC:0,FACU:0,UPL:0};
  all.forEach(x=>{if(sums[x.st]!=null)sums[x.st]+=x.c});
  const totC=Object.values(sums).reduce((a,b)=>a+b,0);
  const pi=totC?Object.entries(sums).reduce((a,[k,v])=>a+v*W[k],0)/totC:null;
  return {per,nDom,nWet,domPct,rapid,sums,totC,pi,any:all.length>0};
}
function soilCalc(p){
  const on=[...SOIL_IND,...SOIL_PROB].filter(([k])=>p.soil.ind[k]).map(([k])=>k);
  const has=p.soil.layers.some(l=>l.top!==""||l.mc);
  return {on,v:on.length?"yes":(has?"no":"na"),prob:on.some(k=>SOIL_PROB.some(([j])=>j===k))};
}
function hydroCalc(p){
  const np=HYD_P.filter(([k])=>p.hydro.p[k]).length, ns=HYD_S.filter(([k])=>p.hydro.s[k]).length;
  const touched=np||ns||p.hydro.surf||p.hydro.wt||p.hydro.sat;
  return {np,ns,v:(np>=1||ns>=2)?"yes":(touched?"no":"na")};
}
function determine(p){
  const vc=vegCalc(p),sc=soilCalc(p),hc=hydroCalc(p);
  let veg="na",via="";
  if(vc.any){
    if(vc.rapid){veg="yes";via="Rapid test (all dominants OBL or FACW)"}
    else if(vc.domPct>50){veg="yes";via="Dominance test (>50% OBL, FACW, FAC)"}
    else if(sc.v==="yes"&&hc.v==="yes"&&vc.pi!=null&&vc.pi<=3){veg="yes";via="Prevalence index ≤ 3.0"}
    else if(sc.v==="yes"&&hc.v==="yes"&&p.veg.morph){veg="yes";via="Morphological adaptations"}
    else{veg="no";via=(vc.pi!=null&&vc.pi<=3)?"Prevalence index passes, but it applies only when hydric soil and wetland hydrology are both present":"No hydrophytic vegetation indicator met"}
  }
  const vals=[veg,sc.v,hc.v];
  const wet=vals.includes("no")?"no":vals.every(v=>v==="yes")?"yes":"na";
  return {vc,sc,hc,veg,via,wet};
}

/* ---------- Header + tabs ---------- */
const word=v=>v==="yes"?"Yes":v==="no"?"No":"Not yet";
function renderStatus(){
  const p=P();if(!p)return;const d=determine(p);
  document.getElementById("status").innerHTML=
    `<div class="factor" data-v="${d.veg}"><span>Hydrophytic vegetation</span><b>${word(d.veg)}</b></div>
     <div class="factor" data-v="${d.sc.v}"><span>Hydric soil</span><b>${word(d.sc.v)}</b></div>
     <div class="factor" data-v="${d.hc.v}"><span>Wetland hydrology</span><b>${word(d.hc.v)}</b></div>
     <div class="factor final" data-v="${d.wet}"><span>Within a wetland?</span><b>${word(d.wet)}</b></div>`;
  if(tab==="veg")renderVegCalcs();
  if(tab==="summary")renderPanel();
}
function renderPointSel(){

const sugg=document.getElementById("sugg");let suggFor=null,suggHits=[],suggAt=-1;
function closeSugg(){sugg.hidden=true;suggHits=[];suggAt=-1;if(suggFor)suggFor.setAttribute("aria-expanded","false");suggFor=null}
function placeSugg(){if(!suggFor||sugg.hidden)return;const b=suggFor.getBoundingClientRect();
  const w=Math.min(Math.max(b.width,300),document.documentElement.clientWidth-16);
  sugg.style.width=w+"px";sugg.style.left=Math.max(8,Math.min(b.left,document.documentElement.clientWidth-w-8))+scrollX+"px";sugg.style.top=b.bottom+scrollY+2+"px"}
function openSugg(input){
  suggFor=input;const q=input.value.trim();
  if(!q){closeSugg();return}
  suggHits=searchSpp(q);suggAt=-1;
  sugg.innerHTML=suggHits.length?suggHits.map((h,i)=>`<div class="opt" role="option" id="opt${i}" data-i="${i}" aria-selected="false"><i>${esc(h.x.sci)}</i><span class="ind" data-s="${h.x.s}"><i></i>${h.x.s}</span><small>${esc(h.x.com||"No common name")}${h.via?` · old name ${esc(h.via)}`:""}</small></div>`).join("")
    :`<div class="none">${SPP.length?"Not on the NWPL list. It will be recorded as UPL unless you change the status.":"Species list not loaded."}</div>`;
  sugg.hidden=false;input.setAttribute("aria-expanded","true");placeSugg();
}
function moveSugg(d){if(!suggHits.length)return;suggAt=(suggAt+d+suggHits.length)%suggHits.length;
  sugg.querySelectorAll(".opt").forEach((o,i)=>o.setAttribute("aria-selected",i===suggAt));
  const o=document.getElementById("opt"+suggAt);o.scrollIntoView({block:"nearest"});suggFor.setAttribute("aria-activedescendant","opt"+suggAt)}
function pickSugg(i){const h=suggHits[i],input=suggFor;if(!h||!input)return;closeSugg();
  input.value=h.x.sci;input.dispatchEvent(new Event("input",{bubbles:true}));
  toast(`${h.x.sci}${h.x.com?" ("+h.x.com+")":""}: ${h.x.s}${h.via?` · ${h.via} is an older name`:""}`)}
main.addEventListener("input",e=>{if(e.target.classList.contains("spin")&&e.inputType)openSugg(e.target)});
main.addEventListener("focusin",e=>{if(e.target.classList.contains("spin")&&e.target.value.trim()&&!SPP_IDX.has(key(e.target.value)))openSugg(e.target)});
main.addEventListener("focusout",e=>{if(e.target===suggFor)setTimeout(()=>{if(document.activeElement!==suggFor)closeSugg()},0)});
main.addEventListener("keydown",e=>{if(e.target!==suggFor||sugg.hidden)return;
  if(e.key==="ArrowDown"){e.preventDefault();moveSugg(1)}else if(e.key==="ArrowUp"){e.preventDefault();moveSugg(-1)}
  else if(e.key==="Enter"&&suggAt>=0){e.preventDefault();pickSugg(suggAt)}else if(e.key==="Escape")closeSugg()});
sugg.addEventListener("pointerdown",e=>e.preventDefault()); // keep focus in the input
sugg.addEventListener("click",e=>{const o=e.target.closest(".opt");if(o)pickSugg(+o.dataset.i)});
addEventListener("resize",placeSugg);addEventListener("scroll",placeSugg,true);
function rerenderStratum(k,focus){
  const el=document.getElementById("st-"+k);const s=STRATA.find(x=>x.k===k);
  el.innerHTML=`<header><h3>${s.name}</h3><span class="note">Plot size: ${s.plot}</span></header>${stratumTable(k)}`;

/* ---------- GPS ---------- */
function locate(){
  const note=document.getElementById("gpsNote");
  if(!navigator.geolocation){note.textContent="Location isn’t available in this browser. Enter coordinates by hand.";return}
  note.textContent="Getting location…";
  navigator.geolocation.getCurrentPosition(pos=>{
    const p=P();p.site.lat=pos.coords.latitude.toFixed(6);p.site.lon=pos.coords.longitude.toFixed(6);save();renderPanel();
    const n=document.getElementById("gpsNote");const acc=Math.round(pos.coords.accuracy*3.281);
    const inArea=pos.coords.latitude>41.0&&pos.coords.latitude<42.55&&pos.coords.longitude>-89.0&&pos.coords.longitude<-87.4;
    n.innerHTML=`Accuracy about ${acc} ft.${inArea?"":' <span class="warn">This point is outside Northeastern Illinois.</span>'}`;
  },err=>{note.textContent=err.code===1?"Location permission was denied. Enter coordinates by hand.":"Couldn’t get a location fix. Try again or enter coordinates by hand."},{enableHighAccuracy:true,timeout:20000});
}

function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
async function addPhotos(files){
  const p=P();let loc=null;
  try{loc=await new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(x=>r(x.coords),()=>r(null),{timeout:8000,enableHighAccuracy:true})})}catch(e){}
  for(const f of files){try{const data=await shrink(f);p.photos.push({data,caption:"",bearing:"",time:Date.now(),lat:loc?loc.latitude:(p.site.lat||""),lon:loc?loc.longitude:(p.site.lon||"")})}catch(e){toast("One photo couldn’t be read.")}}
  save();renderPanel();toast(`${files.length} photo${files.length>1?"s":""} added`);
}

/* ---------- Report ---------- */
function reportHTML(p){
  const d=determine(p),s=p.site,vc=d.vc;
  const yesno=v=>v==="yes"?"Yes":v==="no"?"No":"";
  const strat=STRATA.map(st=>{const c=vc.per[st.k];if(!c.rows.length)return"";
    return `<tr><th colspan="4">${st.name} (plot size: ${st.plot})</th></tr>${c.rows.map(r=>`<tr><td><i>${esc(r.sp)}</i></td><td>${r.c}</td><td>${c.dom.has(r.i)?"Y":"N"}</td><td>${esc(r.st)}${r.src==="hand"?" *":r.nl?" †":""}</td></tr>`).join("")}<tr><td style="text-align:right">Total cover</td><td>${c.tot}</td><td colspan="2">50% = ${+c.fifty.toFixed(1)}, 20% = ${+c.twenty.toFixed(1)}</td></tr>`}).join("");
  const lay=p.soil.layers.filter(l=>l.top!==""||l.mc).map(l=>`<tr><td>${esc(l.top)}–${esc(l.bot)}</td><td>${esc(l.mc)}</td><td>${esc(l.mp)}</td><td>${esc(l.rc)}</td><td>${esc(l.rp)}</td><td>${esc(l.rt)}</td><td>${esc(l.rl)}</td><td>${esc(l.tex)}</td><td>${esc(l.rem)}</td></tr>`).join("");
  const list=(arr,obj)=>arr.filter(([k])=>obj[k]).map(([k,n])=>`${esc(n)} (${k==="OTHER"?"other":k})`).join("; ")||"None";
  /* Where each status came from: the NWPL version that filled it, set by hand, or UPL default for unlisted species. */
  const vrows=STRATA.flatMap(st=>vc.per[st.k].rows);
  const lists=[...new Set(vrows.filter(r=>r.list).map(r=>r.list))];
  const legacy=vrows.filter(r=>!r.list).length;
  if(!lists.length&&LIST&&!legacy)lists.push(LIST.label);
  const srcText=[...lists,legacy?"earlier built-in starter list (before NWPL import)":""].filter(Boolean).join("; ")||listLabel();
  const named=f=>vrows.filter(f).map(r=>`<i>${esc(r.sp)}</i>`).join(", ");
  const srcRows=[esc(srcText)+(LIST&&lists.includes(LIST.label)?`<br><small>Source file ${esc(LIST.source_file)}, SHA-256 ${esc(LIST.sha256.slice(0,16))}…</small>`:""),
    vrows.some(r=>r.src==="hand")?`* Status set by hand: ${named(r=>r.src==="hand")}`:"",
    vrows.some(r=>r.nl)?`† Not on the list, recorded as UPL: ${named(r=>r.nl)}`:"",
    legacy?`From earlier built-in list (not checked against NWPL): ${named(r=>!r.list)}`:""].filter(Boolean).join("<br>");
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Data form ${esc(s.point)}</title><style>
  body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;max-width:8in;margin:.5in auto;color:#000}
  h1{font-size:14pt;text-align:center;margin:0}h2{font-size:11.5pt;background:#ddd;padding:3px 6px;margin:14px 0 6px}
  table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:3px 5px;font-size:10pt;text-align:left;vertical-align:top}
  .kv td:first-child{width:38%;background:#f3f3f3}.c{text-align:center;font-size:9.5pt;margin:2px 0 10px}
  img{width:48%;margin:1%;vertical-align:top}figure{display:inline-block;width:48%;margin:1%;vertical-align:top}figure img{width:100%;margin:0}figcaption{font-size:9pt}
  @media print{h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>
  <h1>Wetland Determination Data Form – Midwest Region</h1><p class="c">Prepared from field app record. Transfer to or attach with the official USACE form as required.<br>Indicator statuses: ${esc(srcText)}</p>
  <table class="kv"><tr><td>Project/site</td><td>${esc(s.project)}</td></tr><tr><td>County, state</td><td>${esc(s.county)} County, Illinois</td></tr><tr><td>Sampling date</td><td>${esc(s.date)}</td></tr>
  <tr><td>Applicant/owner</td><td>${esc(s.owner)}</td></tr><tr><td>Investigator(s)</td><td>${esc(s.investigator)}</td></tr><tr><td>Sampling point</td><td>${esc(s.point)}</td></tr>
  <tr><td>Section, township, range</td><td>${esc(s.str)}</td></tr><tr><td>Landform / local relief / slope</td><td>${esc(s.landform)} / ${esc(s.relief)} / ${esc(s.slope)}${s.slope?"%":""}</td></tr>
  <tr><td>Lat / long / datum</td><td>${esc(s.lat)} / ${esc(s.lon)} / ${esc(s.datum)}</td></tr><tr><td>Soil map unit name</td><td>${esc(s.mapunit)}</td></tr><tr><td>NWI classification</td><td>${esc(s.nwi)}</td></tr>
  <tr><td>Conditions typical for time of year?</td><td>${yesno(s.typical)}</td></tr><tr><td>Significantly disturbed?</td><td>${yesno(s.sigDist)}</td></tr><tr><td>Naturally problematic?</td><td>${yesno(s.natProb)}</td></tr><tr><td>Normal circumstances present?</td><td>${yesno(s.normal)}</td></tr></table>
  <h2>Summary of findings</h2><table class="kv"><tr><td>Hydrophytic vegetation present?</td><td>${yesno(d.veg)}</td></tr><tr><td>Hydric soil present?</td><td>${yesno(d.sc.v)}</td></tr><tr><td>Wetland hydrology present?</td><td>${yesno(d.hc.v)}</td></tr><tr><td><b>Is the sampled area within a wetland?</b></td><td><b>${yesno(d.wet)}</b></td></tr><tr><td>Remarks</td><td>${esc(s.remarks)}</td></tr></table>
  <h2>Vegetation (use scientific names of plants)</h2><table><tr><th>Species</th><th>Absolute % cover</th><th>Dominant species?</th><th>Indicator status</th></tr>${strat||'<tr><td colspan="4">No species recorded</td></tr>'}</table>
  <table class="kv" style="margin-top:6px"><tr><td>Dominance test</td><td>${vc.nWet} of ${vc.nDom} dominants OBL, FACW, or FAC${vc.domPct!=null?` = ${vc.domPct.toFixed(1)}%`:""}</td></tr>
  <tr><td>Prevalence index worksheet</td><td>${STATUSES.map(k=>`${k} ${vc.sums[k]} × ${W[k]} = ${vc.sums[k]*W[k]}`).join("<br>")}<br>Totals: ${vc.totC} (A), ${STATUSES.reduce((a,k)=>a+vc.sums[k]*W[k],0)} (B); PI = B/A = ${vc.pi!=null?vc.pi.toFixed(2):"–"}</td></tr>
  <tr><td>Indicator status source</td><td>${srcRows}</td></tr>
  <tr><td>Hydrophytic vegetation indicators</td><td>${[vc.rapid?"1 – Rapid test":"",vc.domPct>50?"2 – Dominance test is >50%":"",vc.pi!=null&&vc.pi<=3?"3 – Prevalence index is ≤3.0":"",p.veg.morph?"4 – Morphological adaptations":""].filter(Boolean).join("<br>")||"None"}</td></tr>
  <tr><td>Remarks</td><td>${esc(p.veg.remarks)}</td></tr></table>
  <h2>Soil</h2><table><tr><th>Depth (in)</th><th>Matrix color</th><th>%</th><th>Redox color</th><th>%</th><th>Type</th><th>Loc</th><th>Texture</th><th>Remarks</th></tr>${lay||'<tr><td colspan="9">No layers recorded</td></tr>'}</table>
  <table class="kv" style="margin-top:6px"><tr><td>Hydric soil indicators</td><td>${list(SOIL_IND,p.soil.ind)}</td></tr><tr><td>Indicators for problematic hydric soils</td><td>${list(SOIL_PROB,p.soil.ind)}</td></tr>
  <tr><td>Restrictive layer</td><td>${esc(p.soil.restr)||"None"}${p.soil.restrDepth?`, ${esc(p.soil.restrDepth)} in`:""}</td></tr><tr><td>Remarks</td><td>${esc(p.soil.remarks)}</td></tr></table>
  <h2>Hydrology</h2><table class="kv"><tr><td>Primary indicators</td><td>${list(HYD_P,p.hydro.p)}</td></tr><tr><td>Secondary indicators</td><td>${list(HYD_S,p.hydro.s)}</td></tr>
  <tr><td>Surface water depth (in)</td><td>${esc(p.hydro.surf)||"Not present"}</td></tr><tr><td>Water table depth (in)</td><td>${esc(p.hydro.wt)||"Not present"}</td></tr><tr><td>Saturation depth (in)</td><td>${esc(p.hydro.sat)||"Not present"}</td></tr><tr><td>Remarks</td><td>${esc(p.hydro.remarks)}</td></tr></table>
  ${p.photos.length?`<h2>Photo log</h2>${p.photos.map((x,i)=>`<figure><img src="${x.data}" alt=""><figcaption>Photo ${i+1}. ${esc(x.bearing)}${x.caption?" – "+esc(x.caption):""}<br>${new Date(x.time).toLocaleString()}${x.lat?` (${(+x.lat).toFixed(5)}, ${(+x.lon).toFixed(5)})`:""}</figcaption></figure>`).join("")}`:""}
  </body></html>`;
}
function exportFile(name,data){
  const note=document.getElementById("expNote");
  try{
    const type=name.endsWith(".json")?"application/json":"text/html";
    const url=URL.createObjectURL(new Blob([data],{type:type+";charset=utf-8"}));
    const a=document.createElement("a");a.href=url;a.download=name;a.rel="noopener";a.style.display="none";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    toast("Downloading "+name);
  }catch(e){note.innerHTML=`<span class="warn">Couldn’t save the file (${esc(e&&e.message||"error")}).</span>`}
}

/* ---------- Misc ---------- */
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2400)}
function renderAll(){renderPointSel();renderTabs();renderPanel();renderStatus()}
(async()=>{
  idb=await openDB();
  await loadSpecies();
  points=(await dbAll()).sort((a,b)=>a.created-b.created);
  if(!points.length){const p=blank(1);points.push(p);dbPut(p)}
  cur=points[points.length-1].id;renderAll();
  if(!idb)toast("This browser can’t store data. Export before closing.");
  /* Ask the browser not to evict stored points and photos under storage pressure. */
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();

/* ---------- Offline support (service worker) ---------- */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w)return;
        w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)toast("App updated. Reopen it to use the new version.")})});
    }).catch(()=>{});
  });
}
